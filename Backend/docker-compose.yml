services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: maxotech
      POSTGRES_USER: maxotech_app
      POSTGRES_PASSWORD: U4aVrxJj1B1FEZpUhJ75
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxotech_app -d maxotech"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://maxotech_app:U4aVrxJj1B1FEZpUhJ75@db:5432/maxotech
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:-dev-insecure-portal-secret-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
      - ./private_media:/app/private_media

volumes:
  postgres_data: